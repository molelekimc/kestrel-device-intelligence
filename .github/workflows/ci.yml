# Runs on every push and pull request: the whole pipeline is rebuilt from the raw files,
# then the tests, the evaluation evidence tier and the web app checks run against it.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Pipeline, tests and evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build the warehouse (Bronze, Silver, Gold, freshness)
        run: python -m pipeline.run

      - name: Tests, including the slow end-to-end replay test
        run: python -m pytest -q -m "slow or not slow"

      - name: Evaluation (Silver against the answer keys, evidence tier)
        run: python -m evals.run --tier evidence

      - name: Build the latest executive report
        run: python -m reporting.build --week 2026-W43

      - name: Keep the scorecard and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-and-report
          path: |
            evals/results/
            reports/
          retention-days: 14

  web:
    name: Web app (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Container image (as deployed on Render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t kestrel-control-room .

      - name: Run it with the Render settings
        run: |
          docker run -d --name kestrel -p 8080:10000 \
            -e PORT=10000 -e KESTREL_PUBLIC=1 -e KESTREL_DEFAULT_WEEK=2026-W41 \
            kestrel-control-room
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 2; done

      - name: Smoke test
        run: |
          set -e
          curl -sf localhost:8080/api/health | python3 -c "import json,sys; assert json.load(sys.stdin)['ok']"
          curl -sf localhost:8080/api/status | python3 -c "
          import json, sys
          s = json.load(sys.stdin)
          assert s['public'] and s['default_week'] == '2026-W41' and not s['ai_enabled'], s
          print('weeks', s['weeks'][0], 'to', s['weeks'][-1])"
          curl -sf "localhost:8080/api/tools/floor?week=2026-W41" | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          assert len(r['rows']) == 9 and {a['band'] for a in r['rows']} == {'hurting'}, r['rows']"
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          curl -sf localhost:8080/tv | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/refresh)" = 403
          echo "container OK"

      - name: Container log
        if: always()
        run: docker logs kestrel | tail -50
