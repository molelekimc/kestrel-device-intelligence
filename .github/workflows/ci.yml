# Runs on every push and pull request: the whole pipeline is rebuilt from the raw files,
# then the tests, the evaluation evidence tier and the web app checks run against it.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Pipeline, tests and evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Build the warehouse (Bronze, Silver, Gold, freshness)
        run: python -m pipeline.run

      - name: Tests, including the slow end-to-end replay test
        run: python -m pytest -q -m "slow or not slow"

      - name: Evaluation (Silver against the answer keys, evidence tier)
        run: python -m evals.run --tier evidence

      - name: Build the latest executive report
        run: python -m reporting.build --week 2026-W43

      - name: Keep the scorecard and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-and-report
          path: |
            evals/results/
            reports/
          retention-days: 14

  web:
    name: Web app (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
